# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
# =============================================================================
# LumenTrace Wiki · Quartz 5 站点配置
# 修改此文件后请运行: npx quartz build --serve 验证
# 字段含义见: docs/configuration.md
# =============================================================================
configuration:
  pageTitle: LumenTrace Wiki
  pageTitleSuffix: " · LumenTrace"
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: zh-CN
  defaultDateType: modified
  baseUrl: aaaaawwaa.github.io
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - .trash
    - _drafts
    - _vault-raw
    - "*.tmp"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Noto Sans SC
      body: Noto Sans SC
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#f8faf9"
        lightgray: "#dfe9e4"
        gray: "#84968e"
        darkgray: "#3c5149"
        dark: "#203b35"
        secondary: "#287969"
        tertiary: "#a87844"
        highlight: "rgba(40, 121, 105, 0.09)"
        textHighlight: "#fff2a8"
      darkMode:
        light: "#151d1f"
        lightgray: "#344543"
        gray: "#889e95"
        darkgray: "#c4d5cd"
        dark: "#dfe9e4"
        secondary: "#8cd3bc"
        tertiary: "#d5ae7b"
        highlight: "rgba(140, 211, 188, 0.10)"
        textHighlight: "#8a7a00"
plugins:
  - source: "github:quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "github:quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "github:quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "github:quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "github:quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "github:quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "github:quartz-community/description"
    enabled: true
    order: 70
  - source: "github:quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "github:quartz-community/citations"
    enabled: false
    order: 85
  - source: "github:quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "github:quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "github:quartz-community/roam"
    enabled: false
    order: 92
  - source: "github:quartz-community/fonts"
    enabled: true
  - source: "github:quartz-community/remove-draft"
    enabled: true
  - source: "github:quartz-community/explicit-publish"
    enabled: false
  - source: "github:quartz-community/alias-redirects"
    enabled: true
  - source: "github:quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "github:quartz-community/favicon"
    enabled: true
  - source: "github:quartz-community/og-image"
    enabled: true
  - source: "github:quartz-community/cname"
    enabled: false
  - source: "github:quartz-community/canvas-page"
    enabled: true
  - source: "github:quartz-community/content-page"
    enabled: true
  - source: "github:quartz-community/folder-page"
    enabled: true
    options:
      showFolderCount: false
  - source: "github:quartz-community/tag-page"
    enabled: true
  - source: "github:quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "github:quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "github:quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "github:quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "github:quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "github:quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "github:quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: "github:quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "github:quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "github:quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "github:quartz-community/breadcrumbs"
    enabled: true
    options:
      rootName: 首页
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "github:quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "github:quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/aaaaawwaa
        RSS: /index.xml
    layout:
      position: footer
      priority: 50
  - source: "github:quartz-community/recent-notes"
    enabled: false
  - source: "github:quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "github:quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "github:quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---