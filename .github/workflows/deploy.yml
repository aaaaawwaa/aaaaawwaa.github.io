name: Deploy LumenTrace Wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史，供 created-modified-date 读取 git 时间
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test publishing safeguards
        run: npm run test:public
      - name: Check public content
        run: npm run check:public
      - name: Check topic coverage
        run: node scripts/build-topic-guides.mjs --check
      - name: Check content links (case-sensitive)
        run: node scripts/check-links-source.mjs
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Build site
        run: npx quartz build
      - name: Audit build output
        run: npm run audit
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4